services:
  opencart:
    build: tools
    user: 1000:1000
    ports:
      - "80:80"
    volumes:
      - ./upload:/var/www/html
    depends_on:
      - mysql
    command: >
      bash -c "wait-for-it mysql:3306 -t 60 &&
               if [ ! -f /var/www/html/config.php ] && [ -f /var/www/html/config-dist.php ]; then
                 cp /var/www/html/config-dist.php /var/www/html/config.php;
               fi &&
               if [ ! -f /var/www/html/admin/config.php ] && [ -f /var/www/html/admin/config-dist.php ]; then
                 cp /var/www/html/admin/config-dist.php /var/www/html/admin/config.php;
               fi &&
               touch /var/www/html/install.lock &&
               apache2-foreground"

  mysql:
    image: mysql:5.7
    ports:
      # Host 3306 is commonly occupied by a locally installed MySQL, so publish on
      # 3307 instead. Containers still reach this service as `mysql:3306` internally.
      - "3307:3306"
    volumes:
      - ./tools/poolbuy/poolbuy_complete_dump.sql:/docker-entrypoint-initdb.d/01_poolbuy.sql:ro
    environment:
      - MYSQL_ROOT_PASSWORD=opencart
      - MYSQL_DATABASE=opencart

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
    ports:
      - "8080:8080"

  redis:
    image: redis:latest

  memcached:
    image: memcached:latest

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=opencart
      - POSTGRES_DB=opencart

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://opencart:80
    depends_on:
      - opencart
    restart: unless-stopped

